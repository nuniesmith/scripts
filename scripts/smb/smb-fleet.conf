# =============================================================================
# smb-fleet.conf — which host serves which share
# =============================================================================
# Read by both setup-smb-shares.sh (server side) and mount-smb-shares.sh
# (client side), so the two can never drift apart. Edit here, not in the
# scripts.
#
# Looked for in this order; the first hit wins:
#   1. --config PATH
#   2. $SMB_FLEET_CONF
#   3. smb-fleet.conf next to the script
#   4. /etc/smb-fleet.conf
# With none of those present the scripts fall back to the identical built-in
# table in smb-fleet.sh, so a  curl | bash  run still works.
#
# Records are '|' separated. Blank lines and everything after a '#' is ignored.
#
#   host |NAME|ADDRESS|SERVER STRING
#   share|HOST|SHARE|PATH|MODE|COMMENT
#
# ADDRESS is what a *client* dials — hostname, FQDN or Tailscale IP. Leave it
# empty to reuse NAME. Server-side setup ignores it.
#
# MODE:
#   group  Files are forced to the shared group (default 'actions') with
#          setgid directories, so Docker containers running as that uid keep
#          full access. Server setup recursively chowns the tree, so only
#          point this at data directories.
#   owner  Files keep their real owner. Nothing is chowned and no force user
#          is written. Use this for anything under a real user's home, where
#          rewriting ownership would break SSH keys, sudo and login.
#
# PATH may be '~' or '~/sub' for the SMB user's home, resolved from passwd at
# run time.
# =============================================================================

# ── sullivan — media server ──────────────────────────────────────────────────
# Swap the address for a Tailscale IP (e.g. 100.87.125.19) if DNS is unreliable.
host |sullivan|sullivan|Sullivan Media Server
share|sullivan|media|/mnt/media|group|Sullivan Media Root (/mnt/media)
share|sullivan|local-media|/media|group|Sullivan Local Media (/media)

# ── freddy — personal server ─────────────────────────────────────────────────
host |freddy|freddy|Freddy Personal Server
share|freddy|storage|/mnt/1tb|group|Freddy 1TB Storage (/mnt/1tb)
share|freddy|local-media|/media|group|Freddy Local Media (/media)

# ── desktop — workstation ────────────────────────────────────────────────────
# No 'actions' user here: the servers get one from the GitHub Actions deploy,
# the desktop does not. Both shares stay owner-mode.
host |desktop|desktop|Desktop Workstation
share|desktop|home|~|owner|Desktop Home
share|desktop|seed|/mnt/seed|owner|Desktop Seed Storage (/mnt/seed)

# ── add a new host by copying the block above ────────────────────────────────
# host |newbox|100.64.0.5|New Box
# share|newbox|data|/srv/data|group|New Box Data
